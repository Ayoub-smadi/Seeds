[build]
builder = "nixpacks"
buildCommand = "pnpm install && BASE_PATH=/ pnpm --filter @workspace/bazour-store run build && pnpm --filter @workspace/api-server run build"

[deploy]
startCommand = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.healthcheck]
path = "/api/healthz"
