[build]
builder = "nixpacks"
buildCommand = "BASE_PATH=/ pnpm --filter @workspace/bazour-store run build && pnpm --filter @workspace/api-server run build"

[deploy]
startCommand = "pnpm --filter @workspace/db run push && node --enable-source-maps artifacts/api-server/dist/index.mjs"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
